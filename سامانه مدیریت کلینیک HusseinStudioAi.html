<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سامانه مدیریت کلینیک کاشت مو HusseinStudioAi</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f5;--card:#fff;--ink:#14292a;--mute:#5d7273;--teal:#12474a;--teal2:#1d6b6f;--gold:#b8864b;--line:#d7e2e1;--ok:#1f7a4d;--bad:#b3392f;--hair:#3b2a20;--skin:#f0d9c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1b;--card:#15292b;--ink:#e6f0ef;--mute:#9ab3b2;--teal:#1d6b6f;--teal2:#46b0b4;--gold:#d4a566;--line:#27403f;--ok:#4cc38a;--bad:#ef7b70;--hair:#d9c3a8;--skin:#3a4a48}}
:root[data-theme="dark"]{--bg:#0d1a1b;--card:#15292b;--ink:#e6f0ef;--mute:#9ab3b2;--teal:#1d6b6f;--teal2:#46b0b4;--gold:#d4a566;--line:#27403f;--ok:#4cc38a;--bad:#ef7b70;--hair:#d9c3a8;--skin:#3a4a48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#12474a;z-index:30}
.hide{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--teal2);border:1.5px solid var(--teal2)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{width:auto;padding:5px 14px;font-size:.85rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:block;font-size:.88rem;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
input[type=checkbox]{width:auto}
.num{direction:ltr;text-align:right}
.err{color:var(--bad);font-size:.88rem;min-height:1.4em;margin:6px 0}
.hint{color:var(--mute);font-size:.82rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* splash */
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#0c3335,#12474a 60%,#1d6b6f);color:#fff;padding:24px;overflow:hidden;position:relative}
#splash h1{font-size:2rem;font-weight:800;margin:8px 0 0}
#splash .en{letter-spacing:.2em;color:#e3c597;font-weight:600;direction:ltr}
#splash p{opacity:.85;margin:6px 0 22px}
#splash .btn{max-width:260px;background:#e3c597;color:#12383a}
.hero{width:min(340px,86vw);height:auto;display:block}
.hero .sc{fill:var(--skin)}
.st{fill:none;stroke:var(--hair);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:grow 1.6s ease-out forwards;animation-delay:calc(var(--i)*.07s)}
#splash .st{stroke:#e3c597}
@keyframes grow{to{stroke-dashoffset:0}}
.dot{position:absolute;border-radius:50%;background:rgba(227,197,151,.18);animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-26px)}}
.pop{animation:pop .7s .9s both}@keyframes pop{from{opacity:0;transform:translateY(14px)}}
/* auth */
#auth{max-width:420px;margin:0 auto;padding:22px 18px}
#auth .hero{margin:0 auto 6px}
/* app */
header.top{background:#12474a;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top small{display:block;opacity:.8;font-size:.75rem;line-height:1.4}
header.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 14px 100px}
.banner{background:linear-gradient(135deg,#12474a,#1d6b6f);color:#fff;border-radius:18px;padding:16px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;overflow:hidden}
.banner .hero{width:44%;min-width:130px}.banner .st{stroke:#e3c597}
.banner h2{margin:0 0 14px;font-size:1.15rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--teal2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile svg,.ic{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile small{color:var(--mute);font-weight:400;font-size:.76rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.item{border-bottom:1px solid var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.item:last-child{border:0}
.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{background:rgba(31,122,77,.15);color:var(--ok)}.tag.g{background:rgba(184,134,75,.2);color:var(--gold)}
h3{margin:16px 0 4px}
.bubble{padding:9px 14px;border-radius:14px;margin:8px 0;background:var(--line);max-width:92%}
.bubble.me{background:var(--teal);color:#fff;margin-right:auto}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.perms label{font-weight:400;display:flex;gap:6px;align-items:center;margin:2px 0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px;stroke:var(--teal2);fill:none;stroke-width:1.8;stroke-linecap:round}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:0 0 auto;min-width:74px;background:none;border:0;font-size:.72rem;color:var(--mute);cursor:pointer;padding:4px 8px;border-radius:8px}
nav button.on{color:var(--teal2);font-weight:800}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:.88rem;z-index:40}
.row3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:.75rem;color:var(--mute)}
.cd{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;position:relative;padding:0}
.cd.t{border-color:var(--gold);font-weight:800}.cd.s{background:var(--teal);color:#fff}
.cd i{position:absolute;bottom:2px;inset-inline:0;font-size:.62rem;color:var(--gold);font-style:normal;line-height:1.2}.cd.s i{color:#fff}
.mr{margin-top:6px;grid-template-columns:1.3fr 1.5fr .8fr auto}
@media(max-width:480px){.mr{grid-template-columns:1fr 1fr}}
.fo{width:100%;max-width:300px;display:block;margin:6px auto}
@media(prefers-reduced-motion:reduce){.st{animation:none;stroke-dashoffset:0}.dot,.pop{animation:none}}
</style>
</head>
<body>
<section id="splash">
 <i class="dot" style="width:90px;height:90px;top:8%;right:10%"></i><i class="dot" style="width:46px;height:46px;top:62%;left:12%;animation-delay:1.5s"></i><i class="dot" style="width:64px;height:64px;bottom:8%;right:22%;animation-delay:3s"></i>
 <div id="h0"></div>
 <h1 class="pop">کلینیک زیبایی کاشت مو</h1>
 <div class="en pop">HUSSEINSTUDIOAI</div>
 <p class="pop">سامانه مدیریت داخلی کلینیک</p>
 <button class="btn pop" id="enter">ورود به سامانه</button>
</section>
<section id="auth" class="hide"></section>
<section id="app" class="hide">
 <header class="top"><div><b>HusseinStudioAi</b><small id="who"></small></div><button data-a="out">خروج</button></header>
 <main id="view"></main><nav id="nav"></nav>
</section>
<div id="toast" class="hide"></div>
<script>
(()=>{
const $=i=>document.getElementById(i),qa=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa2en=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
const fd=t=>{try{return new Date(t).toLocaleDateString('fa-IR')}catch(e){return ''}};
let S;try{S=JSON.parse(localStorage.getItem('hs2'))}catch(e){}S=S||{users:[],pts:[],clinic:{}};
const save=()=>{try{localStorage.setItem('hs2',JSON.stringify(S));return true}catch(e){toast('حافظه دستگاه پر است');return false}};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2200)};
const H=async(p,s)=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s+p}};
const uid=()=>Math.random().toString(36).slice(2,10);
const pd=s=>String(s==null?'':s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const toJ=(gy,gm,gd)=>{const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const g2=gm>2?gy+1:gy;let days=365*gy+Math.trunc((g2+3)/4)-Math.trunc((g2+99)/100)+Math.trunc((g2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.trunc(days/12053);days%=12053;jy+=4*Math.trunc(days/1461);days%=1461;if(days>365){jy+=Math.trunc((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.trunc(days/31):7+Math.trunc((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return [jy,jm,jd]};
const toG=(jy,jm,jd)=>{let gy=jy<=979?621:1600;jy-=jy<=979?0:979;let days=365*jy+Math.trunc(jy/33)*8+Math.trunc((jy%33+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*Math.trunc(days/146097);days%=146097;if(days>36524){gy+=100*Math.trunc(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.trunc(days/1461);days%=1461;if(days>365){gy+=Math.trunc((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){if(gd<=sa[gm])break;gd-=sa[gm]}return [gy,gm,gd]};
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const p2=n=>String(n).padStart(2,'0'),jstr=(y,m,d)=>y+'/'+p2(m)+'/'+p2(d);
const nowJ=()=>{const n=new Date();return toJ(n.getFullYear(),n.getMonth()+1,n.getDate())};
const today=()=>jstr(...nowJ());
const dim=(y,m)=>m<7?31:m<12?30:(toJ(...toG(y,12,30))[1]===12?30:29);
const wd=(y,m,d)=>{const g=toG(y,m,d);return (new Date(g[0],g[1]-1,g[2]).getDay()+1)%7};
const jsel=(id,v)=>{const [y,m,d]=(v||'').split('/').map(Number),c=nowJ()[0];return `<div class="row3" id="${id}"><select aria-label="سال"><option value="">سال</option>${[c-1,c,c+1,c+2,c+3].map(x=>`<option value="${x}"${x===y?' selected':''}>${pd(x)}</option>`).join('')}</select><select aria-label="ماه"><option value="">ماه</option>${MN.map((n,i)=>`<option value="${i+1}"${i+1===m?' selected':''}>${n}</option>`).join('')}</select><select aria-label="روز"><option value="">روز</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}"${i+1===d?' selected':''}>${pd(i+1)}</option>`).join('')}</select></div>`};
const getJ=id=>{const v=qa('#'+id+' select').map(x=>x.value);if(v.every(x=>!x))return '';if(v.some(x=>!x)||+v[2]>dim(+v[0],+v[1]))return null;return jstr(+v[0],+v[1],+v[2])};
S.pts.forEach(p=>{p.vs=p.vs||[];p.ap.forEach(a=>{if(/^\d{4}-\d\d-\d\d$/.test(a.d)){const g=a.d.split('-').map(Number);a.d=jstr(...toJ(g[0],g[1],g[2]))}})});
S.users.forEach(u=>{if(u.doc===undefined)u.doc=!!(u.role&&u.role.includes('پزشک'))});

const show=id=>['splash','auth','app'].forEach(x=>$(x).classList.toggle('hide',x!==id));
const MODS=[['patients','پرونده بیماران','file','ثبت و مشاهده بیماران'],['appts','نوبت‌دهی','cal','رزرو و تأیید نوبت'],['consult','مشاوره پزشک','doc','یادداشت و پاسخ پزشک'],['visit','ویزیت و نسخه','doc','معاینه، دارو و مراجعه بعدی'],['lab','آزمایشگاه','lab','نتیجه و جوابیه'],['ins','بیمه','ins','اطلاعات بیمه بیمار'],['about','درباره کلینیک','info','معرفی و تماس']];
const PRESET={'پزشک':['patients','appts','consult','visit','lab','ins','about'],'منشی':['patients','appts','ins','about']};
const IC={file:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',doc:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',lab:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/>',ins:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 5a3 3 0 0 1 0 6M18 14c2 .8 3.5 2.6 3.5 6"/>',home:'<path d="M3 11l9-8 9 8v10H3z"/><path d="M10 21v-6h4v6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/>'};
const ico=n=>`<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
function hero(){let s='';for(let i=0;i<24;i++){const t=i/23,x=24+272*t,y=(1-t)**2*150+2*(1-t)*t*56+t*t*150,l=26+14*Math.sin(i*1.7)+10*(1-Math.abs(t-.5)*2),w=7*Math.sin(i*2.3);s+=`<path class="st" style="--i:${i}" d="M${x.toFixed(1)} ${y.toFixed(1)} q ${w.toFixed(1)} ${-l/2} ${(w*1.6).toFixed(1)} ${-l}"/>`}
return `<svg class="hero" viewBox="0 0 320 160" aria-hidden="true"><path class="sc" d="M16 160Q160 40 304 160z"/>${s}</svg>`}
$('h0').innerHTML=hero();
let me=null,cur='',tab='dash',eu=null,q='',cy=1405,cm=1,sd='';{const n=nowJ();cy=n[0];cm=n[1];sd=today()}
const can=m=>me&&(me.admin||(me.perms||[]).includes(m));
const P=id=>S.pts.find(p=>p.id===id);
const pName=p=>p?p.fn+' '+p.ln:'—';
function authHTML(first){return `${hero()}<h2 style="text-align:center;margin:0">${first?'راه‌اندازی اولیه':'ورود کارکنان'}</h2><div class="hint" style="text-align:center">${first?'حساب مدیر کلینیک را بسازید. بعداً پزشکان و منشی‌ها را از پنل مدیریت اضافه می‌کنید.':'با نام کاربری و رمز عبوری که مدیر کلینیک برای شما تعریف کرده وارد شوید.'}</div>${first?'<label for="an">نام و نام خانوادگی مدیر</label><input id="an">':''}<label for="au">نام کاربری</label><input id="au" class="num" autocomplete="username"><label for="ap">رمز عبور${first?' (حداقل ۶ کاراکتر)':''}</label><input id="ap" type="password" class="num" autocomplete="${first?'new-password':'current-password'}"><div class="err" id="ae"></div><button class="btn" data-a="${first?'setup':'login'}">${first?'ایجاد حساب مدیر':'ورود'}</button>`}
$('enter').onclick=()=>{const s=localStorage.getItem('hs2s'),u=S.users.find(x=>x.id===s&&x.on);if(u){me=u;start()}else{$('auth').innerHTML=authHTML(!S.users.length);show('auth')}};
function start(){show('app');$('who').textContent=me.name+' · '+me.role;go('dash')}
function go(t){tab=t;const L=[['dash','خانه']].concat(MODS.filter(m=>can(m[0])).map(m=>[m[0],m[1]]));if(me.admin)L.push(['users','کاربران و دسترسی']);
$('nav').innerHTML=L.map(x=>`<button data-a="go" data-i="${x[0]}" class="${x[0]===t?'on':''}">${x[1]}</button>`).join('');
$('view').innerHTML=({dash,patients,appts,consult,visit,lab,ins,about,users})[t]();window.scrollTo(0,0);if(t==='dash')count()}
function count(){qa('[data-n]').forEach(e=>{const n=+e.dataset.n;let i=0;const t=setInterval(()=>{i+=Math.max(1,Math.ceil(n/20));if(i>=n){i=n;clearInterval(t)}e.textContent=i.toLocaleString('fa-IR')},40)})}
function dash(){const T=today(),V=vp(),ta=V.reduce((a,p)=>a+p.ap.filter(x=>x.d===T).length,0),pend=V.reduce((a,p)=>a+p.ap.filter(x=>x.st!=='ok').length,0),up=[];V.forEach(p=>p.ap.forEach(a=>{if(a.auto&&a.d>=T)up.push({p,a})}));up.sort((x,y)=>(x.a.d+x.a.t)<(y.a.d+y.a.t)?-1:1);
return `<div class="banner"><div><h2>سلام ${esc(me.name)}</h2><div class="hint" style="color:#cfe3e1;margin-bottom:14px">${esc(me.role)} · ${pd(T)}</div></div>${hero()}</div>
<div class="stats"><div class="stat"><b data-n="${V.length}">۰</b><span class="hint">بیمار</span></div><div class="stat"><b data-n="${ta}">۰</b><span class="hint">نوبت امروز</span></div><div class="stat"><b data-n="${pend}">۰</b><span class="hint">منتظر تأیید</span></div></div>
${can('appts')&&up.length?`<div class="card"><b>مراجعات بعدی تعیین‌شده توسط پزشک</b>${up.slice(0,6).map(x=>`<div class="item"><span>${esc(pName(x.p))} <span class="hint">${esc(x.a.dr)}</span></span><span class="tag g">${pd(x.a.d)} ${pd(x.a.t)}</span></div>`).join('')}</div>`:''}
<div class="grid">${MODS.filter(m=>can(m[0])).map(m=>`<button class="tile" data-a="go" data-i="${m[0]}">${ico(m[2])}${m[1]}<small>${m[3]}</small></button>`).join('')}${me.admin?`<button class="tile" data-a="go" data-i="users">${ico('users')}کاربران و دسترسی<small>تعریف پزشک، منشی و ...</small></button>`:''}</div>`}
